# ============================================================
# Nginx — Development (HTTP only)
# Untuk HTTPS: lihat seksi TLS di README dan tambahkan
# blok server port 443 dengan ssl_certificate.
# ============================================================
server {
    listen 80;
    server_name localhost;

    # Security headers
    add_header X-Frame-Options          "DENY"                          always;
    add_header X-Content-Type-Options   "nosniff"                       always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection         "1; mode=block"                 always;

    # Timeout untuk streaming / chat
    proxy_read_timeout    120s;
    proxy_connect_timeout  10s;
    proxy_send_timeout     60s;

    # ── API backend ───────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://api:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # Health / readiness tanpa log (kurangi noise)
    location ~ ^/(health|ready)$ {
        proxy_pass         http://api:8000;
        access_log         off;
    }

    # ── Frontend ──────────────────────────────────────────────────────
    location / {
        proxy_pass         http://web:3000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        # WebSocket support (Next.js HMR saat development)
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}
