# ============================================================
# AI Chatbot MVP — Docker Compose
# Development & Production (VPS)
#
# Profil:
#   automation    → aktifkan n8n
#   object-storage → aktifkan MinIO
#
# Penggunaan development:
#   docker compose up -d postgres
#   docker compose up -d api web
#   docker compose --profile automation up -d n8n
# ============================================================
name: ai-chatbot-mvp

services:
  # ── PostgreSQL + PGVector ──────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend
    # Port untuk akses dari pgAdmin/tools di host
    ports:
      - "5434:5432"

  # ── FastAPI Backend ────────────────────────────────────────────────────
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER}
      APP_ENV: ${APP_ENV:-development}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    # Development: akses langsung tanpa Nginx
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - uploads_data:/app/data/uploads
    networks:
      - backend
      - frontend
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ── Next.js Frontend ──────────────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
    restart: unless-stopped
    environment:
      INTERNAL_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/', (r) => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Nginx Reverse Proxy ────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_healthy
    ports:
      - "80:80"
      # - "443:443"  # aktifkan setelah TLS dikonfigurasi
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      # - ./infra/nginx/certs:/etc/nginx/certs:ro  # untuk TLS
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── n8n Workflow Automation ────────────────────────────────────────────
  n8n:
    image: n8nio/n8n:${N8N_VERSION:-1.67.1}
    restart: unless-stopped
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_USER_MANAGEMENT_DISABLED: "false"
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Asia/Jakarta}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - n8n_data:/home/node/.n8n
    expose:
      - "5678"
    ports:
      - "5678:5678"
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - automation

  # ── pgAdmin (akses via http://localhost:5050) ─────────────────────────
  pgadmin:
    image: dpage/pgadmin4:8.13
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: Admin123!
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    networks:
      - backend
      - frontend
    profiles:
      - tools

  # ── Prometheus (http://localhost:9090) ────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    ports:
      - "9090:9090"
    networks:
      - backend
      - frontend
    profiles:
      - monitoring

  # ── Grafana (http://localhost:3001) ───────────────────────────────────
  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-Admin123!}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3001
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - backend
      - frontend
    profiles:
      - monitoring
  minio:
    image: minio/minio:${MINIO_VERSION:-RELEASE.2024-11-07T00-52-20Z}
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    expose:
      - "9000"
      - "9001"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 5
    profiles:
      - object-storage

# ── Networks ──────────────────────────────────────────────────────────────
networks:
  frontend:
  backend:
    # internal dihapus agar pgAdmin bisa akses postgres dan port binding bisa ke host

# ── Volumes ───────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  uploads_data:
  n8n_data:
  minio_data:
  prometheus_data:
  grafana_data:
